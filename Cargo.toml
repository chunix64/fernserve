[package]
edition      = "2024"
name         = "fernserve"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "fernserve"
path = "./src/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32", "unstable"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32"] }
esp-alloc = { version = "0.11.0", features = ["esp32"] }
esp-rtos = { version = "0.4.0", features = [
    "embassy",
    "esp-alloc",
    "esp-radio",
    "esp32",
] }
esp-radio = { version = "1.0.0-beta.1", features = [
    "esp-alloc",
    "esp32",
    "unstable",
    "wifi",
] }
esp-storage = { version = "0.10.0", features = ["embedded-storage", "esp32"] }
esp-println = { version = "0.18.0", features = ["esp32", "log-04"] }

embassy-executor = { version = "0.10.0", features = [] }
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
embassy-time = "0.5.0"
embassy-net = { version = "0.9.1", features = ["dhcpv4", "dns", "medium-ethernet", "tcp", "udp"] }
smoltcp = { version = "0.14.0", default-features = false, features = [
    "medium-ethernet",
    "multicast",
    "proto-dhcpv4",
    "proto-dns",
    "proto-ipv4",
    "socket-dns",
    "socket-icmp",
    "socket-raw",
    "socket-tcp",
    "socket-udp",
] }

embedded-io = { version = "0.7.1", features = ["alloc"] }
embedded-io-async = "0.7.0"
embedded-storage = "0.3.2"
embedded-hal-async = "1.0.0"

static_cell = "2.1.1"
critical-section = "1.2.0"
heapless = { version = "0.9.3", features = ["alloc"] }
tinyrlibc = { version = "0.5.1", features = ["strspn", "strcspn", "strlen"] }
littlefs2 = { version = "0.8.1", features = ["alloc"] }
serde = { version = "1.0.229", features = ["alloc", "derive"], default-features = false }
serde_json = { version = "1.0.154", features = ["alloc"], default-features = false }
picoserve = { version = "0.20.1", features = ["embassy", "json"] }
form_urlencoded = { version = "1.2.2", default-features = false, features = ["alloc"] }
thiserror = { version = "2.0.21", default-features = false }
anyhow = { version = "1.0.104", default-features = false, features = ["backtrace"] }
log = "0.4.34"

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
