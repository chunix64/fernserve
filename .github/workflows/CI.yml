name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  checking:
    name: checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust for Xtensa
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          default: true
          ldproxy: true

      - name: cargo fmt
        run: cargo fmt --check

      - name: Setup xtensa-toolchain
        run: |
          INCS=$(echo | xtensa-esp32-elf-gcc -E -Wp,-v -xc - 2>&1 >/dev/null \
            | sed -n 's|^ \(/.*\)$|-isystem \1|p' | tr '\n' ' ')
          echo "Using: $INCS"
          echo "BINDGEN_EXTRA_CLANG_ARGS_xtensa_esp32_none_elf=$INCS" >> "$GITHUB_ENV"

      - name: Setup xtensa-toolchain (fallback)
        run: sudo apt-get update && sudo apt-get install -y libc6-dev-i386

      - name: cargo check
        env:
          BINDGEN_EXTRA_CLANG_ARGS_xtensa_esp32_none_elf: "-I/usr/include/x86_64-linux-gnu"
        run: |
          cargo check

      - name: cargo build
        run: |
          cargo build

      - name: cargo clippy
        run: |
          cargo clippy -- -D warnings
