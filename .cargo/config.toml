[target.xtensa-esp32-none-elf]
runner = [
  "espflash",
  "flash",
  "--monitor",
  "--chip", "esp32",
  "--baud", "921600",
  "--partition-table", "partitions.csv",
  "--output-format", "{L:severity:bold} - {s:severity}",
  "--log-format", "defmt"
]


[build]
rustflags = [
  "-C", "link-arg=-nostartfiles",
  "-C", "link-arg=-Tdefmt.x",
]

target = "xtensa-esp32-none-elf"

[unstable]
build-std = ["core", "alloc"]

[env]
DEFMT_LOG = "debug"
# DEFMT_LOG = "trace,esp_radio=debug,esp_phy=debug"
CROSS_COMPILE="xtensa-esp32-elf"
CC = "xtensa-esp32-elf-cc"
AR = "xtensa-esp32-elf-ar"
CFLAGS = "-mlongcalls"
